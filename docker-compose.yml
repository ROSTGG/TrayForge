# ─────────────────────────────────────────────────
# TrayForge Platform — 3 контейнера
# Запуск: docker compose up -d
# ─────────────────────────────────────────────────
services:
  # ── Портал + reverse proxy ──
  portal:
    image: ghcr.io/rostgg/trayforge-portal:main
    container_name: portal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/archive/mscghost.dynet.com/fullchain1.pem:/etc/nginx/ssl/fullchain1.pem:ro
      - /etc/letsencrypt/archive/mscghost.dynet.com/privkey1.pem:/etc/nginx/ssl/privkey1.pem:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      trayforge:
        condition: service_started
      stencil-api:
        condition: service_healthy

  # ── TrayForge (статика) ──
  trayforge:
    image: ghcr.io/rostgg/trayforge-app:main
    container_name: trayforge
    restart: unless-stopped

  # ── Stencil Generator (Python API + фронтенд) ──
  stencil-api:
    image: ghcr.io/rostgg/trayforge-stencil:main
    container_name: stencil-api
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: "25"
      JOB_TTL_MINUTES: "60"
    tmpfs:
      - /tmp/gerber-stencil-jobs:size=512m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
