# ─────────────────────────────────────────────────────
# TrayForge — docker-compose для VPS
# Запуск: docker compose up -d
# Приложение доступно на https://m.dynet.com
# ─────────────────────────────────────────────────────
services:
  trayforge:
    image: ghcr.io/rostgg/trayforge:latest
    container_name: trayforge
    restart: unless-stopped
    ports:
      - "80:80"              # HTTP → редирект на HTTPS
      - "443:443"            # HTTPS с SSL
    volumes:
      - /etc/letsencrypt/archive/mscghost.dynet.com:/etc/nginx/ssl:ro   # монтируем сертификаты (read-only)
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
