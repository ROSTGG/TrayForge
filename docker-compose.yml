# ─────────────────────────────────────────────────────
# MSCGhost Apps — портал + приложения
# Запуск: docker compose up -d
# https://mscghost.dynet.com       → портал
# https://mscghost.dynet.com/trayforge/  → TrayForge
# ─────────────────────────────────────────────────────
services:
  trayforge:
    image: ghcr.io/rostgg/trayforge:latest
    container_name: trayforge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/archive/mscghost.dynet.com:/etc/nginx/ssl:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
