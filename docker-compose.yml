# ─────────────────────────────────────────────────
# TrayForge Platform — 3 контейнера
# Запуск: docker compose up -d
# ─────────────────────────────────────────────────
services:
  # ── Портал + reverse proxy ──
  portal:
    image: ghcr.io/rostgg/trayforge-portal:main
    container_name: portal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/archive/mscghost.dynet.com/fullchain1.pem:/etc/nginx/ssl/fullchain1.pem:ro
      - /etc/letsencrypt/archive/mscghost.dynet.com/privkey1.pem:/etc/nginx/ssl/privkey1.pem:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - trayforge
      - stencil-api

  # ── TrayForge (статика) ──
  trayforge:
    image: ghcr.io/rostgg/trayforge-app:main
    container_name: trayforge
    restart: unless-stopped

  # ── Stencil Generator (Python API + фронтенд) ──
  stencil-api:
    image: ghcr.io/rostgg/trayforge-stencil:main
    container_name: stencil-api
    restart: unless-stopped
