services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stencil-backend
    ports:
      - "8000:8000"
    volumes:
      - ./aperture_library.json:/app/aperture_library.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - stencil-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stencil-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stencil-net

networks:
  stencil-net:
    driver: bridge
