server {
    listen 80;
    server_name mscghost.dynet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mscghost.dynet.com;

    ssl_certificate     /etc/nginx/ssl/fullchain1.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey1.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Портал (главная) ──
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── TrayForge ──
    location /trayforge/ {
        proxy_pass http://trayforge:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Stencil Generator ──
    location /stencil/ {
        proxy_pass http://stencil-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
        proxy_read_timeout 120s;
    }

    # ── Stencil static fallback (until image rebuilt with relative paths) ──
    location = /styles.css {
        proxy_pass http://stencil-api:8080/styles.css;
    }
    location = /app.js {
        proxy_pass http://stencil-api:8080/app.js;
    }

    # Кеш статики
    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
