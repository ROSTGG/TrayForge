server {
    listen 80;
    server_name mscghost.dynet.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Портал (главная) ──
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── TrayForge ──
    location /trayforge/ {
        proxy_pass http://trayforge:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Stencil Generator ──
    location /stencil/ {
        proxy_pass http://stencil-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 10M;
        proxy_read_timeout 120s;
    }

    # ── Stencil static fallback (until image rebuilt with relative paths) ──
    location = /styles.css {
        proxy_pass http://stencil-api:8080/styles.css;
    }
    location = /app.js {
        proxy_pass http://stencil-api:8080/app.js;
    }

    # ── Gerber / KiCad Viewer (KiCanvas) ──
    location /kicanvas/ {
        proxy_pass http://kicanvas:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Кеш статики
    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
