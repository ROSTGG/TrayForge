server {
    listen 80;
    server_name mscghost.dynet.com;

    # Gzip — НЕ применяем к wasm (уже сжато) и бинарным файлам
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 256;


    # ── Портал (главная) ──
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── TrayForge ──
    location /trayforge/ {
        proxy_pass         http://trayforge:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # TrayForge — статика от корня (приложение ссылается на /assets/, /static/ и т.д.)
    location /assets/ {
        proxy_pass http://trayforge:80/assets/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Stencil Generator ──
    location /stencil/ {
        proxy_pass         http://stencil-api:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size  25M;
        proxy_read_timeout    120s;
    }

    # Stencil — статика от корня
    location = /styles.css {
        proxy_pass http://stencil-api:8080/styles.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /app.js {
        proxy_pass http://stencil-api:8080/app.js;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── KiCanvas (Gerber / KiCad Viewer) ──
    location /kicanvas/ {
        proxy_pass         http://kicanvas:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # Важно для WebAssembly — большие файлы, долгая загрузка
        proxy_buffering       off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  50M;

        # Заголовки для SharedArrayBuffer (нужны для WASM threading)
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Защита от доступа к скрытым файлам
    location ~ /\. {
        deny all;
        return 404;
    }
}
