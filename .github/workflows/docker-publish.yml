# ─────────────────────────────────────────────────
# TrayForge — автосборка и публикация Docker-образа
# Триггер: push в main или создание тега v*
# Результат: образ в ghcr.io/<owner>/trayforge
# ─────────────────────────────────────────────────
name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:          # ручной запуск из UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/trayforge

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write         # нужно для ghcr.io

    steps:
      # 1 — Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v4

      # 2 — Настраиваем Docker Buildx (кеш + мульти-платформа)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3 — Логинимся в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4 — Генерируем теги и метаданные
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 5 — Собираем и пушим образ
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
